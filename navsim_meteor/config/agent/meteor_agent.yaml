_target_: navsim_meteor.agent.MeteorONNXAgent
_convert_: 'all'

model_path: ${oc.env:METEOR_ONNX_PATH}
providers: null
trajectory_extension: linear

trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5
